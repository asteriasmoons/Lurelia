apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: im.lystaria.Lurelia.LureliaWidgets
    intents:
    - metadata:
        name: CompleteTimelineItemWidgetIntent_0
        title: Complete Timeline Item
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Complete ${+applicationName} Timeline item'
    - metadata:
        name: SkipTimelineItemWidgetIntent_1
        title: Skip Timeline Item
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Skip ${+applicationName} Timeline item'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - LureliaWidgets
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
